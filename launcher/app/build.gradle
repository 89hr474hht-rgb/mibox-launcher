plugins {
    id 'com.android.application'
}

// mibox-launcher fork: `-Pmibox` builds the Mi Box edition (updater module, the owner's release key,
// SemVer from mibox/VERSION). Without it the build is upstream CleanYourTV, byte for byte.
def mibox = providers.gradleProperty('mibox').isPresent()
def miboxVersion = mibox ? rootProject.file('mibox/VERSION').text.trim() : null
def miboxSigning = [:]
if (mibox) {
    if (!(miboxVersion ==~ /\d+\.\d+\.\d+/)) throw new GradleException("mibox/VERSION must be X.Y.Z, found '$miboxVersion'")
    // CI passes the key through the environment; on the owner's Mac it sits outside the repo.
    def env = System.getenv()
    if (env.MIBOX_KEYSTORE_FILE) {
        miboxSigning = [storeFile: env.MIBOX_KEYSTORE_FILE, storePassword: env.MIBOX_KEYSTORE_PASSWORD,
                        keyAlias: env.MIBOX_KEY_ALIAS, keyPassword: env.MIBOX_KEY_PASSWORD]
    } else {
        def props = new Properties()
        def f = new File(System.getProperty('user.home'), '.mibox-launcher/keystore.properties')
        if (!f.exists()) throw new GradleException("-Pmibox needs the release key: $f or MIBOX_KEYSTORE_* variables")
        f.withInputStream { props.load(it) }
        miboxSigning = props
    }
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        // Opt-in identity for firmware with a package-name HOME allowlist.
        // Xiaomi: docs/devices/xiaomi-mitv-aetp0-dofus.md (com.ts.launcher).
        // ColorOS TV: docs/devices/oppo-k9-55-oppocnm632.md (com.oneplus.tv.launcher2).
        applicationId providers.gradleProperty('launcherApplicationId').getOrElse('com.gathin.tvhome')
        minSdk 26
        targetSdk 34
        versionCode 13
        versionName '3.4'
        if (mibox) {
            def (maj, min, pat) = miboxVersion.tokenize('.').collect { it as int }
            versionCode maj * 10000 + min * 100 + pat
            versionName miboxVersion
            // LaunchOS is shown in French (mibox_french), with English as the fallback: the other languages'
            // strings, AndroidX's included, are left out of the Mi Box APK (about 20 KB).
            resourceConfigurations += ['en', 'fr']
        }
    }

    if (mibox) {
        signingConfigs {
            miboxRelease {
                storeFile file(miboxSigning.storeFile)
                storePassword miboxSigning.storePassword
                keyAlias miboxSigning.keyAlias
                keyPassword miboxSigning.keyPassword
            }
        }
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: sign with the debug key so it installs over a debug build.
            signingConfig signingConfigs.debug
            if (mibox) signingConfig signingConfigs.miboxRelease
        }
    }

    // mibox-launcher fork: the Mi Box edition's values for upstream keys (config.xml switches, a few labels),
    // from mibox/app-res. The release source set outranks main, so only the keys listed there change.
    if (mibox) {
        sourceSets.release.res.srcDirs += rootProject.file('mibox/app-res')
    }

    packagingOptions {
        resources {
            // Kotlin metadata pulled in by AndroidX's dependencies. This launcher is plain Java and never reads it;
            // leaving it out saves about 14 KB of every install.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
    // mibox-launcher fork: the updater, only in the Mi Box edition (see the top of this file).
    if (mibox) implementation project(':mibox')
}
