// mibox-launcher fork: the Mi Box edition (LaunchOS) as a library merged into the launcher's release build: updater,
// settings panes, home screen extras, sleep screen, music player. Plain Java and the platform's own APIs, no library,
// so the APK stays small on a 2 GB box.
plugins {
    id 'com.android.library'
}

def miboxVersion = rootProject.file('mibox/VERSION').text.trim()

android {
    namespace 'com.gathin.tvhome.mibox'
    compileSdk 34

    defaultConfig {
        minSdk 26
        // Read by the updater: the installed edition's SemVer and where its releases are published.
        buildConfigField 'String', 'MIBOX_VERSION', "\"$miboxVersion\""
        buildConfigField 'String', 'RELEASES_REPO', '"89hr474hht-rgb/mibox-launcher"'
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// UpstreamHooksTest reads the launcher's own resources and this module's sources: rerun it when they change.
tasks.withType(Test).configureEach {
    inputs.dir(rootProject.file('app/src/main/res')).withPropertyName('launcherRes')
    inputs.dir(rootProject.file('mibox/app-res')).withPropertyName('forkRes')
    inputs.dir(file('src/main/java')).withPropertyName('libraryJava')
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    // android.jar's org.json is a stub in plain JVM tests; the real one is test-only.
    testImplementation 'org.json:json:20240303'
}
