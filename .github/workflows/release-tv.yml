# mibox-launcher fork: builds, signs and publishes LaunchOS TV (mibox/tv) when a tv-vX.Y.Z tag is pushed.
# LaunchOS TV's own updater reads these releases. They are never marked "latest", and LaunchOS's updater
# ignores tags that are not vX.Y.Z, so the two apps share this repository without seeing each other's releases.
#
# Secrets (Settings > Secrets and variables > Actions), never in the repo:
#   MIBOX_KEYSTORE_BASE64   base64 of the release keystore (.jks)
#   MIBOX_KEYSTORE_PASSWORD, MIBOX_KEY_ALIAS, MIBOX_KEY_PASSWORD
name: Release (LaunchOS TV)

on:
  push:
    tags: ["tv-v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release-tv
  cancel-in-progress: false

env:
  # SHA-256 of the release certificate. The updater only installs an APK signed like the installed app;
  # this check stops a release built with any other key before it is published.
  EXPECTED_CERT: ea3231bad936833e9f2b7d81e64b946b2c290a7e568d996391af57706fcb50e7
  BUILD_TOOLS: "34.0.0"
  # Media3 and the app: 0.1.0 is about 1.1 MB. The gate catches a dependency pulled in by mistake.
  MAX_APK_BYTES: "3145728"

jobs:
  release:
    name: Build, sign and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: The tag is a release of main, matching mibox/tv/VERSION and its changelog
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#tv-v}"
          echo "$version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' \
            || { echo "tag $tag is not tv-vMAJOR.MINOR.PATCH"; exit 1; }
          file_version="$(tr -d '[:space:]' < mibox/tv/VERSION)"
          test "$version" = "$file_version" \
            || { echo "tag $tag but mibox/tv/VERSION says $file_version"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "tag $tag is not on main"; exit 1; }
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' mibox/tv/CHANGELOG.md | sed -e '/./,$!d' > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md" \
            || { echo "mibox/tv/CHANGELOG.md has no '## [$version]' section"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Release key
        env:
          MIBOX_KEYSTORE_BASE64: ${{ secrets.MIBOX_KEYSTORE_BASE64 }}
        run: |
          test -n "$MIBOX_KEYSTORE_BASE64" || { echo "secret MIBOX_KEYSTORE_BASE64 is missing"; exit 1; }
          umask 077
          printf '%s' "$MIBOX_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "MIBOX_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Unit tests, lint and signed release build
        working-directory: mibox/tv
        env:
          MIBOX_KEYSTORE_PASSWORD: ${{ secrets.MIBOX_KEYSTORE_PASSWORD }}
          MIBOX_KEY_ALIAS: ${{ secrets.MIBOX_KEY_ALIAS }}
          MIBOX_KEY_PASSWORD: ${{ secrets.MIBOX_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease

      - name: Check the APK before publishing it
        run: |
          apk=mibox/tv/app/build/outputs/apk/release/app-release.apk
          bt="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          size=$(stat -c %s "$apk")
          echo "release APK: $((size / 1024)) KB"
          test "$size" -lt "$MAX_APK_BYTES" || { echo "APK is over $((MAX_APK_BYTES / 1024)) KB"; exit 1; }
          badging="$("$bt/aapt2" dump badging "$apk" | head -1)"
          echo "$badging"
          IFS=. read -r major minor patch <<< "$VERSION"
          code=$((major * 10000 + minor * 100 + patch))
          echo "$badging" | grep -q "name='com.gathin.launchos.tv' versionCode='$code' versionName='$VERSION'" \
            || { echo "package, versionCode $code or versionName $VERSION is wrong"; exit 1; }
          certs="$("$bt/apksigner" verify --print-certs "$apk" | grep 'certificate SHA-256 digest' | awk '{print $NF}' | sort -u)"
          test "$certs" = "$EXPECTED_CERT" || { echo "APK is not signed with the release key only: $certs"; exit 1; }
          mkdir -p dist
          cp "$apk" "dist/launchos-tv-$VERSION.apk"
          (cd dist && sha256sum "launchos-tv-$VERSION.apk" > "launchos-tv-$VERSION.apk.sha256")
          cat "dist/launchos-tv-$VERSION.apk.sha256"
          { cat "$RUNNER_TEMP/notes.md"; echo; echo "SHA-256: $(cut -d' ' -f1 "dist/launchos-tv-$VERSION.apk.sha256")"; } \
            > "$RUNNER_TEMP/release-notes.md"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/launchos-tv-$VERSION.apk" "dist/launchos-tv-$VERSION.apk.sha256" \
            --title "LaunchOS TV $VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" --verify-tag \
            --latest=false

      - name: Forget the key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
